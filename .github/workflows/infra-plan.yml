name: Infra Terraform Plan

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub Environment (secrets)
        required: true
        type: choice
        default: dev
        options: [dev]

concurrency:
  group: infra-plan-${{ github.repository }}-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.10.2"

jobs:
  static:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform

      - name: terraform validate (dev stacks)
        run: node scripts/terraform-stacks.mjs validate dev

  terraform-plan:
    name: Terraform plan (GCS backend)
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}
      TF_PLAN_DIR: ${{ github.workspace }}/.terraform-plan
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform plan (all stacks)
        run: node scripts/terraform-stacks.mjs plan dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan-dev-${{ github.run_id }}
          path: ${{ github.workspace }}/.terraform-plan
          if-no-files-found: ignore
          retention-days: 14
